<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 늘 밝은 화면으로 (2026-10-20). 휴대폰 브라우저의 "웹 페이지 어둡게"가 우리 색을 뒤집지 않게 한다 -->
  <meta name="color-scheme" content="only light">
  <title>회원가입 · 머니 to 홈</title>
  <link rel="stylesheet" href="css/common.css?v=20261021-2">
  <link rel="stylesheet" href="css/auth.css?v=20261020-90">
</head>
<body data-page="signup">
  <!-- P-08 회원가입. 담당: 김목산. Figma "확정 목업 v3"의 P-08, 와이어프레임 설명서 11장.
       아이디 → 비밀번호 → 비밀번호 확인을 차례로 묻는다. 실명과 연락처는 받지 않는다.
       가입을 마치면 바로 로그인된 상태가 된다 (FR-USER-01).
       가입 전 확인(P-08 ⑥)에서 수집 항목과 목적에 동의해야 '가입하기'가 켜진다 (3차, FR-USER-05). -->
  <!-- 웹(가로 1200px 이상)에서만 왼쪽 위에 보이는 로고. 안은 js/layout.js가 그린다. 모바일에는 없다. -->
  <header class="header" id="header"></header>
  <div class="top-space"></div>

  <nav class="progress auth-nav" aria-label="뒤로">
    <a class="progress__back" href="login.html" id="auth-back" aria-label="이전 화면">‹</a>
  </nav>

  <form id="signup-form" class="form-page form-page--keys auth" novalidate>
    <main class="page">
      <header class="form-page__head auth__head">
        <h1 class="title" id="signup-title">사용할 아이디를 정해 주세요</h1>
        <p class="subtitle" id="signup-subtitle">실명과 연락처는 받지 않습니다.</p>
      </header>

      <!-- 칸의 순서: 묻는 순서대로 위에서 아래. 하나를 넣으면 다음 칸이 그 아래에 열린다 (2026-10-21 팀장 요청) -->
      <!-- 아이디. 다음 단계에서도 위에 남고, 누르면 다시 고칠 수 있다 -->
      <div class="field" id="signup-id-field">
        <label class="field__label" for="signup-id">아이디</label>
        <div class="field__row">
          <input class="field__input auth__input" id="signup-id" name="login_id" type="text" enterkeyhint="next" autocomplete="username"
                 autocapitalize="off" spellcheck="false" maxlength="40" aria-describedby="signup-id-rules signup-id-message">
        </div>
        <ul class="auth__rules" id="signup-id-rules">
          <li class="auth__rule" data-rule="start">영문 소문자로 시작</li>
          <li class="auth__rule" data-rule="chars">영문 소문자와 숫자만</li>
          <li class="auth__rule" data-rule="length">5자 이상 20자 이하</li>
        </ul>
        <p class="auth__message" id="signup-id-message" role="alert"></p>
      </div>

      <div class="field" id="signup-password-field" hidden>
        <label class="field__label" for="signup-password">비밀번호</label>
        <div class="field__row">
          <input class="field__input auth__input" id="signup-password" name="password" type="password" enterkeyhint="next"
                 autocomplete="new-password" aria-describedby="signup-password-rules signup-password-message">
        </div>
        <ul class="auth__rules" id="signup-password-rules">
          <li class="auth__rule" data-rule="length">8자 이상</li>
          <li class="auth__rule" data-rule="letter">영문 포함</li>
          <li class="auth__rule" data-rule="digit">숫자 포함</li>
        </ul>
        <p class="auth__message" id="signup-password-message" role="alert"></p>
      </div>

      <div class="field" id="signup-confirm-field" hidden>
        <label class="field__label" for="signup-confirm">비밀번호 확인</label>
        <div class="field__row">
          <input class="field__input auth__input" id="signup-confirm" name="password_confirm" type="password" enterkeyhint="next"
                 autocomplete="new-password" aria-describedby="signup-confirm-message">
        </div>
        <p class="auth__message" id="signup-confirm-message" role="alert"></p>
      </div>

      <!-- P-08 ⑥ 수집 항목과 목적. 가입 전 확인 단계에서만 보인다 -->
      <div class="auth__consent" id="signup-consent" hidden>
        <label class="auth__check">
          <input class="auth__checkbox" id="signup-agreed" type="checkbox" aria-describedby="signup-consent-text">
          <span class="auth__consent-title">수집 항목과 목적에 동의합니다</span>
        </label>
        <p class="auth__consent-text" id="signup-consent-text">
          수집 항목: 아이디, 비밀번호, 입력한 재무정보와 저축 계획<br>
          목적: 다음에 이어서 볼 수 있게 저장
        </p>
      </div>
    </main>

    <div class="bottom-action">
      <p class="snackbar" id="signup-error" role="alert" hidden></p>
      <button type="submit" class="button button--primary" id="signup-submit" disabled>확인</button>
      <p class="auth__links" id="signup-login" hidden>
        <a class="auth__link" href="login.html">이미 계정이 있습니다. 로그인</a>
      </p>
    </div>
  </form>

  <!-- P-08 ⑦ 가입 완료 -->
  <section class="form-page auth auth-done" id="signup-done" hidden>
    <main class="page">
      <div class="auth-done__mark" aria-hidden="true"></div>
      <h1 class="title">가입이 끝났습니다</h1>
      <p class="subtitle" id="signup-done-text"></p>
    </main>
    <div class="bottom-action">
      <a class="button button--primary" id="signup-start" href="profile.html">시작하기</a>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/format.js?v=20261019-2"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js?v=20261019-1"></script>
  <script src="js/form-flow.js?v=20261021-2"></script>
  <script src="js/auth.js?v=20261021-2"></script>
  <script src="js/scrollbar.js?v=20261020-6"></script>
</body>
</html>
